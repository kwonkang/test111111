<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NDPA TERMINAL — 전치 암호 해독 작전 : 크립토노바</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #030712;
            --panel: #0a0f1a;
            --border: #1a2744;
            --accent: #00f5d4;
            --accent2: #f72585;
            --accent3: #f5c400;
            --red: #ff2d55;
            --blue: #0090ff;
            --purple: #b44fff;
            --text: #c8d8f0;
            --dim: #4a5568;
            --glow: 0 0 20px rgba(0,245,212,0.25);
            --glow-red: 0 0 20px rgba(255,45,85,0.3);
            --glow-purple: 0 0 20px rgba(180,79,255,0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── 배경 스캔라인 & 노이즈 효과 ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,245,212,0.015) 2px,
                rgba(0,245,212,0.015) 4px
            );
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 20% 50%, rgba(0,144,255,0.04) 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 20%, rgba(180,79,255,0.04) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        /* ── 헤더 ── */
        #header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 56px;
            background: rgba(3,7,18,0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }
        .header-logo {
            font-family: 'Orbitron', monospace;
            font-size: 14px;
            font-weight: 900;
            color: var(--accent);
            letter-spacing: 3px;
            text-shadow: var(--glow);
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
        }
        #header-status {
            color: var(--red);
            animation: blink 2s infinite;
        }
        #header-status.authorized { color: var(--accent); animation: none; }
        #header-score {
            color: var(--accent3);
            font-weight: 700;
            font-size: 14px;
        }
        @keyframes blink { 50% { opacity: 0.3; } }

        /* ── 메인 레이아웃 ── */
        #app-wrapper {
            padding-top: 72px;
            padding-bottom: 160px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-left: 16px;
            padding-right: 16px;
        }
        #app {
            width: 100%;
            max-width: 760px;
            position: relative;
            z-index: 1;
        }

        /* ── 패널 & 카드 ── */
        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 28px;
            position: relative;
            overflow: hidden;
        }
        .panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0.5;
        }
        .panel.danger::before { background: linear-gradient(90deg, transparent, var(--red), transparent); }
        .panel.purple::before { background: linear-gradient(90deg, transparent, var(--purple), transparent); }
        .panel.gold::before { background: linear-gradient(90deg, transparent, var(--accent3), transparent); }

        /* ── 타이포 ── */
        .title-orb {
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            letter-spacing: 2px;
        }
        .mono { font-family: 'Share Tech Mono', monospace; }

        /* ── 버튼 ── */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 28px;
            border-radius: 4px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 14px;
        }
        .btn-accent {
            background: var(--accent);
            color: var(--bg);
            box-shadow: var(--glow);
        }
        .btn-accent:hover { background: #00dfc0; transform: translateY(-1px); }
        .btn-red { background: var(--red); color: #fff; box-shadow: var(--glow-red); }
        .btn-red:hover { background: #e0002a; }
        .btn-outline {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
        }
        .btn-outline:hover { background: rgba(0,245,212,0.08); }
        .btn-full { width: 100%; }
        .btn-disabled { opacity: 0.4; cursor: not-allowed; }

        /* ── 인트로 ── */
        .intro-terminal {
            font-family: 'Share Tech Mono', monospace;
            background: #000;
            border: 1px solid #1a3a1a;
            border-radius: 6px;
            padding: 20px;
            font-size: 13px;
            line-height: 2;
            color: #22c55e;
        }
        .intro-terminal .cmd { color: #86efac; }
        .intro-terminal .err { color: var(--red); }
        .intro-terminal .warn { color: var(--accent3); }
        .intro-terminal .acc { color: var(--accent); }

        /* ── 폼 입력 ── */
        .input-field {
            width: 100%;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 12px 16px;
            color: var(--accent);
            font-family: 'Share Tech Mono', monospace;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        .input-field:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: var(--glow);
        }
        .input-label {
            display: block;
            font-size: 11px;
            color: var(--dim);
            margin-bottom: 6px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* ── 브랜치 허브 ── */
        .zone-card {
            border: 1px solid;
            border-radius: 8px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.25s;
            background: var(--panel);
            position: relative;
            overflow: hidden;
        }
        .zone-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.02) 0%, transparent 60%);
        }
        .zone-card.blue-zone { border-color: rgba(0,144,255,0.3); }
        .zone-card.blue-zone:hover { border-color: var(--blue); box-shadow: 0 0 24px rgba(0,144,255,0.15); transform: translateY(-2px); }
        .zone-card.purple-zone { border-color: rgba(180,79,255,0.3); }
        .zone-card.purple-zone:hover { border-color: var(--purple); box-shadow: var(--glow-purple); transform: translateY(-2px); }
        .zone-card.cleared { border-color: rgba(0,245,212,0.4); opacity: 0.6; cursor: not-allowed; }
        .zone-card.boss-zone {
            border-color: var(--red);
            background: rgba(255,45,85,0.05);
            animation: boss-pulse 2s infinite;
            cursor: pointer;
        }
        @keyframes boss-pulse {
            0%,100% { box-shadow: 0 0 10px rgba(255,45,85,0.2); }
            50% { box-shadow: 0 0 30px rgba(255,45,85,0.5); }
        }

        /* ── 스토리 패널 ── */
        .story-text {
            font-size: 15px;
            line-height: 1.9;
            color: #a0b4cc;
            white-space: pre-line;
        }
        .story-text .highlight { color: var(--accent); font-weight: 700; }
        .story-text .danger-text { color: var(--red); font-weight: 700; }
        .story-cipher {
            font-family: 'Share Tech Mono', monospace;
            background: rgba(0,245,212,0.04);
            border: 1px solid rgba(0,245,212,0.15);
            border-left: 3px solid var(--accent);
            padding: 16px 20px;
            border-radius: 0 6px 6px 0;
            font-size: 15px;
            color: var(--accent);
            letter-spacing: 1px;
            margin: 16px 0;
        }
        
        /* ── 문제 패널 ── */
        .quiz-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }
        .quiz-badge {
            font-family: 'Orbitron', monospace;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            padding: 4px 12px;
            border-radius: 2px;
            background: rgba(0,245,212,0.1);
            color: var(--accent);
            border: 1px solid rgba(0,245,212,0.3);
        }
        .quiz-badge.trap { background: rgba(255,45,85,0.1); color: var(--red); border-color: rgba(255,45,85,0.3); }
        .chance-display {
            font-family: 'Share Tech Mono', monospace;
            font-size: 13px;
            color: var(--dim);
        }
        .chance-display span { font-size: 20px; font-weight: 700; color: var(--accent); }
        .chance-display span.danger { color: var(--red); animation: blink 0.8s infinite; }

        .desc-box {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 18px 20px;
            font-size: 14px;
            line-height: 1.8;
            color: #8899bb;
            margin-bottom: 20px;
        }
        .desc-box.trap { border-color: rgba(255,45,85,0.2); background: rgba(255,45,85,0.03); }

        .question-text {
            font-size: 16px;
            font-weight: 700;
            color: #e0eaff;
            line-height: 1.7;
            margin-bottom: 20px;
            padding: 16px;
            background: rgba(0,144,255,0.04);
            border-left: 3px solid var(--blue);
            border-radius: 0 6px 6px 0;
        }
        .question-text.trap { background: rgba(255,45,85,0.04); border-left-color: var(--red); }

        /* ── MC 옵션 ── */
        .mc-grid { display: grid; gap: 10px; }
        .mc-option {
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 14px 18px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            text-align: left;
            font-size: 14px;
            color: var(--text);
            line-height: 1.6;
        }
        .mc-option:hover { border-color: var(--accent); background: rgba(0,245,212,0.04); color: #fff; }
        .mc-option.trap:hover { border-color: var(--red); background: rgba(255,45,85,0.04); }
        .mc-num {
            flex-shrink: 0;
            width: 24px; height: 24px;
            border: 1px solid var(--dim);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-family: 'Share Tech Mono', monospace;
            color: var(--dim);
        }

        /* ── TF 옵션 ── */
        .tf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 400px; }
        .tf-option {
            padding: 20px;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid var(--border);
            font-size: 28px;
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            text-align: center;
            transition: all 0.2s;
        }
        .tf-option.o-btn { color: var(--accent); }
        .tf-option.o-btn:hover { border-color: var(--accent); background: rgba(0,245,212,0.06); box-shadow: var(--glow); }
        .tf-option.x-btn { color: var(--red); }
        .tf-option.x-btn:hover { border-color: var(--red); background: rgba(255,45,85,0.06); box-shadow: var(--glow-red); }

        /* ── 단답 입력 ── */
        .sa-form {
            display: flex;
            background: #000;
            border: 1px solid var(--accent);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: var(--glow);
        }
        .sa-form input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 14px 18px;
            color: var(--accent);
            font-family: 'Share Tech Mono', monospace;
            font-size: 15px;
        }
        .sa-form input::placeholder { color: var(--dim); }
        .sa-form input:focus { outline: none; }
        .sa-form button {
            background: var(--accent);
            color: var(--bg);
            border: none;
            padding: 0 24px;
            font-weight: 900;
            cursor: pointer;
            font-family: 'Orbitron', monospace;
            font-size: 12px;
            letter-spacing: 2px;
            transition: background 0.2s;
        }
        .sa-form button:hover { background: #00dfc0; }

        /* ── 피드백 모달 ── */
        #feedback-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        #feedback-modal.show { display: flex; }
        .feedback-box {
            max-width: 520px;
            width: 100%;
            background: var(--panel);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 32px;
            animation: modal-in 0.3s ease-out;
        }
        @keyframes modal-in {
            from { transform: scale(0.9) translateY(20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }
        .feedback-box.success { border-color: var(--accent); box-shadow: var(--glow); }
        .feedback-box.failure { border-color: var(--red); box-shadow: var(--glow-red); }
        .feedback-box.retry { border-color: var(--accent3); }
        .feedback-content {
            font-size: 14px;
            line-height: 1.8;
            color: #8899bb;
            white-space: pre-line;
            margin: 16px 0 24px;
        }
        .feedback-exp {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 14px;
            font-size: 13px;
            line-height: 1.7;
            color: #7a8ca0;
            margin-top: 12px;
        }

        /* ── 터미널 로그 ── */
        #log-panel {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 130px;
            background: rgba(0,0,0,0.9);
            border-top: 1px solid #0a1a0a;
            padding: 8px 16px;
            z-index: 50;
        }
        .log-header {
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            color: #1a4a1a;
            margin-bottom: 6px;
            letter-spacing: 2px;
        }
        #log-container {
            height: 90px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        #log-container::-webkit-scrollbar { width: 4px; }
        #log-container::-webkit-scrollbar-track { background: #000; }
        #log-container::-webkit-scrollbar-thumb { background: #1a3a1a; }
        .log-line {
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            color: #2a6a2a;
        }
        .log-line.error { color: #6a1a1a; }
        .log-line.success { color: #1a4a6a; }
        .log-line.warning { color: #5a4a0a; }

        /* ── 결과 화면 ── */
        .result-score {
            font-family: 'Orbitron', monospace;
            font-size: 64px;
            font-weight: 900;
            color: var(--accent3);
            text-align: center;
            text-shadow: 0 0 40px rgba(245,196,0,0.4);
        }
        .result-grade {
            font-family: 'Orbitron', monospace;
            font-size: 20px;
            font-weight: 700;
            text-align: center;
        }
        .grade-s { color: var(--accent); }
        .grade-a { color: var(--blue); }
        .grade-b { color: var(--purple); }
        .grade-c { color: var(--accent3); }

        /* ── 애니메이션 ── */
        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .glitch {
            animation: glitch 3s infinite;
        }
        @keyframes glitch {
            0%,90%,100% { text-shadow: none; }
            92% { text-shadow: -2px 0 var(--red), 2px 0 var(--accent); }
            94% { text-shadow: 2px 0 var(--red), -2px 0 var(--accent); }
            96% { text-shadow: none; }
        }

        /* ── 진행 표시줄 ── */
        #progress-bar {
            position: fixed;
            top: 56px; left: 0; right: 0;
            height: 2px;
            background: var(--border);
            z-index: 99;
        }
        #progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--blue));
            transition: width 0.5s ease;
            box-shadow: var(--glow);
        }

        /* ── 힌트 토글 ── */
        .hint-box {
            margin-top: 16px;
            background: rgba(245,196,0,0.04);
            border: 1px solid rgba(245,196,0,0.2);
            border-radius: 6px;
            padding: 14px 18px;
            font-size: 13px;
            color: var(--accent3);
            display: none;
        }
        .hint-toggle {
            background: transparent;
            border: 1px solid rgba(245,196,0,0.3);
            color: var(--accent3);
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 12px;
            transition: all 0.2s;
        }
        .hint-toggle:hover { background: rgba(245,196,0,0.08); }

        /* ── 코어 위젯 ── */
        .core-display {
            display: flex;
            gap: 12px;
            margin: 12px 0;
        }
        .core-item {
            flex: 1;
            text-align: center;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: rgba(0,0,0,0.3);
        }
        .core-item.active {
            border-color: var(--accent);
            background: rgba(0,245,212,0.04);
        }
        .core-dot {
            width: 12px; height: 12px;
            border-radius: 50%;
            margin: 0 auto 8px;
            background: var(--dim);
        }
        .core-dot.lit {
            background: var(--accent);
            box-shadow: 0 0 12px var(--accent);
            animation: core-pulse 2s infinite;
        }
        @keyframes core-pulse {
            0%,100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* ── 스크롤바 ── */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #1a2744; border-radius: 3px; }

        /* ── 특수 암호문 박스 ── */
        .cipher-block {
            font-family: 'Share Tech Mono', monospace;
            font-size: 18px;
            letter-spacing: 3px;
            color: var(--accent);
            background: rgba(0,245,212,0.04);
            border: 1px solid rgba(0,245,212,0.2);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin: 16px 0;
            position: relative;
        }
        .cipher-block::before {
            content: 'INTERCEPTED SIGNAL';
            position: absolute;
            top: -10px; left: 50%;
            transform: translateX(-50%);
            background: var(--panel);
            padding: 0 8px;
            font-size: 10px;
            color: var(--dim);
            letter-spacing: 2px;
        }
        .cipher-block.red { color: var(--red); border-color: rgba(255,45,85,0.2); background: rgba(255,45,85,0.03); }
        .cipher-block.red::before { content: 'WARNING SIGNAL'; }

        /* ── 그리드 테이블 ── */
        .matrix-table {
            font-family: 'Share Tech Mono', monospace;
            border-collapse: collapse;
            margin: 16px auto;
            font-size: 14px;
        }
        .matrix-table td {
            width: 44px; height: 44px;
            border: 1px solid rgba(0,245,212,0.2);
            text-align: center;
            vertical-align: middle;
            color: var(--accent);
            background: rgba(0,245,212,0.02);
        }
        .matrix-table th {
            background: rgba(0,245,212,0.08);
            color: var(--dim);
            font-size: 12px;
            padding: 6px;
            border: 1px solid rgba(0,245,212,0.2);
        }

        /* ── 반응형 ── */
        @media (max-width: 600px) {
            .panel { padding: 18px; }
            .result-score { font-size: 48px; }
        }
    </style>
</head>
<body>

<!-- 헤더 -->
<div id="header">
    <div class="header-logo glitch">NDPA TERMINAL v4.0</div>
    <div class="header-right">
        <span id="header-status">STATUS: UNAUTHORIZED</span>
        <span id="header-score" style="display:none"></span>
    </div>
</div>

<!-- 진행 표시줄 -->
<div id="progress-bar"><div id="progress-fill" style="width:0%"></div></div>

<!-- 메인 앱 -->
<div id="app-wrapper">
    <div id="app"></div>
</div>

<!-- 피드백 모달 -->

const TOTAL_QUESTIONS = 14;

// ==========================================
// 유틸
// ==========================================
function addLog(text, type = 'info') {
    const container = document.getElementById('log-container');
    const div = document.createElement('div');
    div.className = 'log-line' + (type === 'error' ? ' error' : type === 'success' ? ' success' : type === 'warning' ? ' warning' : '');
    div.innerText = `[${new Date().toLocaleTimeString('ko-KR', {hour12: false})}] ${text}`;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
}

function updateProgress() {
    const pct = Math.min(100, Math.round((answeredQuestions / TOTAL_QUESTIONS) * 100));
    document.getElementById('progress-fill').style.width = pct + '%';
}

// ==========================================
// 화면 전환
// ==========================================
function navigateTo(stepId) {
    currentStep = stepId;
    chances = 3;

    const app = document.getElementById('app');
    app.innerHTML = '';

    const statusEl = document.getElementById('header-status');
    const scoreEl = document.getElementById('header-score');

    if (stepId === 'intro') {
        statusEl.innerText = 'STATUS: UNAUTHORIZED';
        statusEl.className = '';
        scoreEl.style.display = 'none';
    } else {
        statusEl.innerText = 'STATUS: CONNECTED';
        statusEl.className = 'authorized';
        scoreEl.style.display = 'block';
        scoreEl.innerText = `SCORE: ${totalScore}`;
    }

    if (stepId === 'intro') app.innerHTML = renderIntro();
    else if (stepId === 'branch') app.innerHTML = renderBranch();
    else if (stepId === 'result') app.innerHTML = renderResult();
    else {
        // 데이터 조회 (별칭 처리)
        let data = STAGE_DATA[stepId];
        // q1A_real, q1B_real 등 별칭
        if (!data && stepId === 'q1A') { data = STAGE_DATA['q1A_real']; currentStep = 'q1A'; }
        if (!data && stepId === 'q1B') { data = STAGE_DATA['q1B_real']; currentStep = 'q1B'; }
        if (data) app.innerHTML = renderStepContent(stepId, data);
    }

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderStepContent(stepId, data) {
    if (!data) return '';

    if (data.type === 'story') {
        const moodColor = data.mood === 'red' ? 'var(--red)' :
                          data.mood === 'purple' ? 'var(--purple)' : 'var(--blue)';
        const icon = data.mood === 'red' ? 'fa-skull' :
                     data.mood === 'purple' ? 'fa-network-wired' : 'fa-unlock-keyhole';

        // desc 에서 <strong> 태그 처리
        const formattedDesc = data.desc
            .replace(/\n/g, '\n')
            .replace(/<strong>(.*?)<\/strong>/g, '<strong style="color:#fff">$1</strong>');

        return `
        <div class="fade-in" style="display:flex;flex-direction:column;gap:20px">
            <div class="panel" style="--accent:${moodColor}">
                <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
                    <div style="width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.04);border:1px solid;border-color:${moodColor};display:flex;align-items:center;justify-content:center;color:${moodColor}">
                        <i class="fa-solid ${icon}"></i>
                    </div>
                    <div>
                        <div style="font-size:10px;color:var(--dim);letter-spacing:2px;font-family:'Share Tech Mono',monospace">SITUATION REPORT</div>
                        <h2 style="font-family:'Orbitron',monospace;font-size:15px;font-weight:700;color:${moodColor}">${data.title}</h2>
                    </div>
                </div>
                <div class="story-text" style="white-space:pre-line">${formattedDesc}</div>
            </div>
            <button onclick="navigateTo('${data.next}')" class="btn btn-full" style="background:${moodColor};color:#000;font-weight:700">
                계속 진행 <i class="fa-solid fa-chevron-right" style="margin-left:8px"></i>
            </button>
        </div>
        `;
    }

    const isTrap = data.isTrap;
    const moodColor = isTrap ? 'var(--red)' :
                      data.mood === 'purple' ? 'var(--purple)' : 'var(--blue)';

    // 설명 텍스트 HTML 변환
    const descHtml = (data.desc || '')
        .replace(/<strong>(.*?)<\/strong>/g, '<strong style="color:#fff">$1</strong>');

    let quizHtml = `
    <div class="fade-in panel ${isTrap ? 'danger' : data.mood === 'purple' ? 'purple' : ''}">
        <div class="quiz-header">
            <div>
                <div class="quiz-badge ${isTrap ? 'trap' : ''}">${isTrap ? '⚠ TRAP ACTIVATED' : '▶ MISSION'}</div>
                <h2 style="font-family:'Orbitron',monospace;font-size:14px;font-weight:700;color:${moodColor};margin-top:8px">${data.title}</h2>
            </div>
            <div class="chance-display">
                기회&nbsp;<span id="chance-display" class="${chances === 1 ? 'danger' : ''}">${chances}</span>
            </div>
        </div>

        <div class="desc-box ${isTrap ? 'trap' : ''}">${descHtml}</div>

        <div class="question-text ${isTrap ? 'trap' : ''}">${data.q}${data.q.includes('cipher-inline') ? '' : ''}</div>
    `;

    if (data.type === 'sa') {
        quizHtml += `
        <form onsubmit="handleShortAnswer(event, '${stepId}')">
            <div class="sa-form">
                <input type="text" id="sa-input" placeholder="해독된 답을 입력하라" autocomplete="off" autofocus>
                <button type="submit">ENTER</button>
            </div>
            <p style="font-size:11px;color:var(--dim);margin-top:8px;font-family:'Share Tech Mono',monospace">
                ※ 띄어쓰기 없이 한글로만 입력 · 숫자 문제는 숫자만
            </p>
        </form>
        `;
    } else if (data.type === 'tf') {
        quizHtml += `<div class="tf-grid">`;
        quizHtml += `<button onclick="handleMCAnswer(0,'${stepId}')" class="tf-option o-btn">O</button>`;
        quizHtml += `<button onclick="handleMCAnswer(1,'${stepId}')" class="tf-option x-btn">X</button>`;
        quizHtml += `</div>`;
    } else {
        quizHtml += `<div class="mc-grid">`;
        data.opts.forEach((opt, idx) => {
            quizHtml += `
            <button onclick="handleMCAnswer(${idx},'${stepId}')" class="mc-option ${isTrap ? 'trap' : ''}">
                <span class="mc-num">${idx + 1}</span>
                <span>${opt}</span>
            </button>`;
        });
        quizHtml += `</div>`;
    }

    quizHtml += `
        <button class="hint-toggle" onclick="toggleHint()">
            <i class="fa-solid fa-lightbulb"></i> 힌트 보기
        </button>
        <div class="hint-box" id="hint-box">
            <i class="fa-solid fa-lightbulb" style="margin-right:8px"></i>${data.hint}
        </div>
    </div>
    `;

    return quizHtml;
}

function toggleHint() {
    const box = document.getElementById('hint-box');
    if (box) box.style.display = box.style.display === 'block' ? 'none' : 'block';
}

            <div style="font-family:'Share Tech Mono',monospace;font-size:13px;display:flex;flex-direction:column;gap:10px">
                <div style="display:flex;justify-content:space-between">
                    <span style="color:var(--dim)">요원 학번</span>
                    <span>${studentInfo.id}</span>
                </div>
                <div style="display:flex;justify-content:space-between">
                    <span style="color:var(--dim)">요원 이름</span>
                    <span>${studentInfo.name}</span>
                </div>
                <div style="display:flex;justify-content:space-between">
                    <span style="color:var(--dim)">클리어 루트</span>
                    <span style="color:var(--accent)">A구역 + B구역 + 보스전</span>
                </div>
                <div style="display:flex;justify-content:space-between;border-top:1px solid var(--border);padding-top:10px">
                    <span style="color:var(--dim)">최종 점수</span>
                    <span style="color:var(--accent3);font-size:18px;font-weight:700">${totalScore}점</span>
                </div>
            </div>
            <button onclick="submitToGoogleAndCopy()" class="btn btn-accent btn-full" style="margin-top:20px">
                <i class="fa-solid fa-satellite-dish"></i> 결과 전송 및 보고서 복사
            </button>
            <p id="copy-msg" style="display:none;text-align:center;font-size:13px;color:var(--accent3);margin-top:12px;font-family:'Share Tech Mono',monospace"></p>
        </div>
    </div>
    `;
}

// ==========================================
// 답변 처리
// ==========================================
function handleMCAnswer(selectedIndex, stepId) {
    let data = STAGE_DATA[stepId];
    if (!data) {
        if (stepId === 'q1A') data = STAGE_DATA['q1A_real'];
        if (stepId === 'q1B') data = STAGE_DATA['q1B_real'];
    }
    if (!data) return;
    processAnswer(selectedIndex === data.ans, data, stepId);
}

function handleShortAnswer(e, stepId) {
    e.preventDefault();
    const inputEl = document.getElementById('sa-input');
    const answer = inputEl.value.replace(/\s+/g, '').trim();
    if (!answer) return;
    let data = STAGE_DATA[stepId];
    if (!data) {
        if (stepId === 'q1A') data = STAGE_DATA['q1A_real'];
        if (stepId === 'q1B') data = STAGE_DATA['q1B_real'];
    }
    if (!data) return;
    const isCorrect = data.ans.includes(answer);
    processAnswer(isCorrect, data, stepId);
    inputEl.value = '';
}

function processAnswer(isCorrect, data, stepId) {
    answeredQuestions++;
    updateProgress();

    let nextStep = '';
    let isRetry = false;
    const correctAnswerStr = data.type === 'sa' ? data.ans[0] : data.opts[data.ans];

    const modal = document.getElementById('feedback-modal');
    const box = document.getElementById('feedback-box');
    const icon = document.getElementById('feedback-icon');
    const titleEl = document.getElementById('feedback-title');
    const contentEl = document.getElementById('feedback-content');
    const btn = document.getElementById('feedback-btn');

    if (isCorrect) {
        totalScore += data.pts;
        nextStep = data.nextC;
        document.getElementById('header-score').innerText = `SCORE: ${totalScore}`;

        box.className = 'feedback-box success';
        icon.className = 'fa-solid fa-circle-check';
        icon.style.color = 'var(--accent)';
        titleEl.style.color = 'var(--accent)';
        titleEl.innerText = '해독 성공';

        let expHtml = data.exp.replace(/\n/g, '\n');
        contentEl.innerHTML = `<span style="color:var(--accent);font-weight:700">+${data.pts}점 획득!</span>\n\n<div class="feedback-exp">${expHtml}</div>`;

        btn.className = 'btn btn-accent btn-full';
        btn.innerText = '확인 및 계속';

        addLog(`[SUCCESS] 정답! +${data.pts}점 / 누적: ${totalScore}점`, 'success');
    } else {
        if (chances > 1) {
            chances--;
            isRetry = true;

            box.className = 'feedback-box retry';
            icon.className = 'fa-solid fa-triangle-exclamation';
            icon.style.color = 'var(--accent3)';
            titleEl.style.color = 'var(--accent3)';
            titleEl.innerText = `오답 — 재시도 (남은 기회: ${chances})`;

            contentEl.innerHTML = `틀렸다. 다시 생각해봐라.\n\n<div class="feedback-exp"><i class="fa-solid fa-lightbulb" style="color:var(--accent3);margin-right:6px"></i>${data.hint}</div>`;

            btn.className = 'btn btn-full' ;
            btn.style.background = 'var(--accent3)';
            btn.style.color = '#000';
            btn.innerText = '다시 시도하기';

            const chanceEl = document.getElementById('chance-display');
            if (chanceEl) {
                chanceEl.innerText = chances;
                if (chances === 1) chanceEl.className = 'danger';
            }

            addLog(`[WARNING] 오답. 남은 기회: ${chances}`, 'warning');
        } else {
            nextStep = data.nextI;

            box.className = 'feedback-box failure';
            icon.className = 'fa-solid fa-skull-crossbones';
            icon.style.color = 'var(--red)';
            titleEl.style.color = 'var(--red)';
            titleEl.innerText = '해독 실패';

            contentEl.innerHTML = `모든 기회를 소진했다.\n정답: <span style="color:#fff;font-weight:700">[ ${correctAnswerStr} ]</span>\n\n<div class="feedback-exp">${data.exp}</div>`;

            btn.className = 'btn btn-red btn-full';
            btn.style.background = '';
            btn.style.color = '';
            btn.innerText = '계속 진행';

            addLog(`[ERROR] 최종 실패. 정답: ${correctAnswerStr}`, 'error');
        }
    }

    // 보스 진입 분기 처리
    if (!isRetry && nextStep === 'storyF') {
        if (stepId.includes('A') || stepId === 'q3A' || stepId === 'trapA3' || stepId === 'q2A' || stepId === 'trapA2' || stepId === 'q1A_real' || stepId === 'q1A' || stepId === 'trapA1' || stepId === 'storyA1_go') {
            isACleared = true;
        }
        if (stepId.includes('B') || stepId === 'q3B' || stepId === 'trapB3' || stepId === 'q2B' || stepId === 'trapB2' || stepId === 'q1B_real' || stepId === 'q1B' || stepId === 'trapB1') {
            isBCleared = true;
        }
        nextStep = 'branch';

        let extraMsg = '';
        if (isACleared && isBCleared) {
            extraMsg = '\n\n<span style="color:var(--accent)">⚡ A/B 코어 모두 확보! 메인 서버실 개방!</span>';
        } else {
            extraMsg = '\n\n해당 구역의 코어를 확보했다. 허브로 돌아가 나머지 구역을 클리어하라.';
        }
        contentEl.innerHTML += extraMsg;
    }

    // A/B 판별 (storyF 아닌 경우도 추적)
    if (!isRetry) {
        const aSteps = ['q1A','q1A_real','trapA1','q2A','trapA2','q3A','trapA3'];
        const bSteps = ['q1B','q1B_real','trapB1','q2B','trapB2','q3B','trapB3'];
        if (nextStep === 'branch' || nextStep === 'storyF' || nextStep === 'storyA2' || nextStep === 'storyA3') {
            // keep tracking
        }
        if (nextStep === 'storyF') {
            if (aSteps.includes(stepId)) isACleared = true;
            if (bSteps.includes(stepId)) isBCleared = true;
        }
    }

    currentFeedback.nextStep = nextStep;
    currentFeedback.isRetry = isRetry;
    modal.classList.add('show');
}

function closeFeedbackAndProceed() {
    document.getElementById('feedback-modal').classList.remove('show');
    document.getElementById('feedback-btn').style.background = '';
    document.getElementById('feedback-btn').style.color = '';
    if (!currentFeedback.isRetry) {
        navigateTo(currentFeedback.nextStep);
    }
}

// ==========================================
// 시작 처리
// ==========================================
function handleStart() {
    const idEl = document.getElementById('input-id');
    const nameEl = document.getElementById('input-name');
    if (!idEl.value.trim() || !nameEl.value.trim()) {
        idEl.style.borderColor = 'var(--red)';
        nameEl.style.borderColor = 'var(--red)';
        return;
    }
    studentInfo.id = idEl.value.trim();
    studentInfo.name = nameEl.value.trim();

    document.getElementById('log-container').innerHTML = '';
    addLog(`[AUTH] 신원 확인 완료 — ${studentInfo.name} 요원`);
    addLog('[SYSTEM] 작전 크립토노바 로딩 중...');
    addLog('[WARN] 종이와 펜을 준비하십시오', 'warning');

    setTimeout(() => {
        addLog('[SYSTEM] 메인 통신망 허브 접속 완료', 'success');
        navigateTo('branch');
    }, 1200);
}

// ==========================================
// 결과 전송
// ==========================================
function submitToGoogleAndCopy() {
    const reportText = `[NDPA 크립토노바 작전 보고서]
요원 학번: ${studentInfo.id}
요원 이름: ${studentInfo.name}
클리어: A구역 + B구역 + 최종 보스전
최종 점수: ${totalScore}점`;

    const textArea = document.createElement('textarea');
    textArea.value = reportText;
    document.body.appendChild(textArea);
    textArea.select();
    try { document.execCommand('copy'); } catch (err) {}
    document.body.removeChild(textArea);

    const formData = new FormData();
    formData.append(ENTRY_ID_STUDENT_ID, studentInfo.id);
    formData.append(ENTRY_ID_NAME, studentInfo.name);
    formData.append(ENTRY_ID_SCORE, totalScore);
    formData.append(ENTRY_ID_ROUTE, "완전 정복(A+B+보스)");

    fetch(GOOGLE_FORM_URL, { method: "POST", mode: "no-cors", body: formData })
        .then(() => {
            const msgEl = document.getElementById('copy-msg');
            msgEl.innerText = "✓ 전송 완료! 보고서가 클립보드에 복사되었습니다. 선생님께 붙여넣기(Ctrl+V) 하세요.";
            msgEl.style.display = 'block';
        })
        .catch(() => {
            const msgEl = document.getElementById('copy-msg');
            msgEl.innerText = "복사는 완료. 전송 실패 시 선생님께 직접 점수를 알려주세요.";
            msgEl.style.color = 'var(--red)';
            msgEl.style.display = 'block';
        });
}

// ==========================================
// 데이터 별칭 연결 (story1A 등 내부 링크용)
// ==========================================
STAGE_DATA['q1A'] = STAGE_DATA['q1A_real'];
STAGE_DATA['q1B'] = STAGE_DATA['q1B_real'];

// ==========================================
// 시작
// ==========================================
window.onload = () => navigateTo('intro');
</script>
